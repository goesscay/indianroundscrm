# /etc/nginx/sites-available/erp.indianrounds.in  (symlink into sites-enabled)
# HTTP-only first; `certbot --nginx -d erp.indianrounds.in` then adds the TLS server block + redirect.
server {
    listen 80;
    listen [::]:80;
    server_name erp.indianrounds.in;

    root /srv/erp/api/public;
    client_max_body_size 12m;

    location ~ /\.(?!well-known) { deny all; }

    # Laravel API + Sanctum (same origin as the Next.js app, so cookies just work)
    location ^~ /api/auth/ {
        limit_req zone=ir_auth burst=10 nodelay;   # zone defined in /etc/nginx/conf.d/ir-ratelimit.conf
        try_files $uri /index.php?$query_string;
    }
    location ^~ /api/ { try_files $uri /index.php?$query_string; }
    location = /sanctum/csrf-cookie { try_files $uri /index.php?$query_string; }

    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    # Everything else: Next.js
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
